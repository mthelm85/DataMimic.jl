[sources]
DataMimic = {path = ".."}

[compat]
Documenter = "1"

# Tracks MaterialDocs main rather than its registered releases, so theme work
# pushed there reaches this site on the next docs build without a release.
# Its dependencies, including MaterialDesignColors, resolve from the General
# registry. To pin to releases instead, delete this block.
[sources.MaterialDocs]
url = "https://github.com/mthelm85/MaterialDocs.jl.git"

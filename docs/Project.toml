[deps]
DataMimic = "cb7d7795-550a-4968-bbdc-2a75efce1373"
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
# MaterialColors is an indirect dependency, listed here only so its [sources]
# entry below is legal - Julia requires a source to name a package in `deps`.
MaterialColors = "3927ea69-822a-40ab-97d4-2bc957378337"
MaterialDocs = "10bdffc8-969c-4dd4-83f3-742518eccd6b"

[sources]
DataMimic = {path = ".."}

[compat]
Documenter = "1"

[sources.MaterialDocs]
url = "https://github.com/mthelm85/MaterialDocs.jl.git"

# MaterialDocs declares this source itself, but [sources] is NOT transitive:
# it applies only to the project being resolved, so MaterialDocs' own block is
# ignored here. Without this entry a clean resolve - which is what CI does
# every run - fails with "MaterialColors has no known versions". A local
# build hides it, because the gitignored Manifest already has it pinned.
# Remove when MaterialColors is registered.
[sources.MaterialColors]
url = "https://github.com/mthelm85/MaterialColors.jl.git"
